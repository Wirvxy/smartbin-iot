<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapports - Smart Waste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Rapports et Statistiques</h2>
        
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-file-pdf" style="font-size: 3rem; color: #dc3545;"></i>
                        <h5 class="mt-3">Rapport PDF</h5>
                        <p class="text-muted">Générer un rapport PDF complet</p>
                        <a th:href="@{/reports/pdf}" class="btn btn-danger">
                            <i class="bi bi-download"></i> Télécharger PDF
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="bi bi-file-earmark-spreadsheet" style="font-size: 3rem; color: #198754;"></i>
                        <h5 class="mt-3">Export CSV</h5>
                        <p class="text-muted">Exporter les données en CSV</p>
                        <a th:href="@{/reports/csv}" class="btn btn-success">
                            <i class="bi bi-download"></i> Télécharger CSV
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
