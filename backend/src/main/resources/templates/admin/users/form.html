<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(~{::title}, ~{})}">
    <title th:text="${user.id != null} ? |Modifier ${user.username} – SmartBin| : 'Nouvel utilisateur – SmartBin'">Utilisateur – SmartBin</title>
</head>
<body>
<header th:replace="~{layout/base :: topbar('users')}"></header>

<main class="page page--narrow">
    <a class="crumb" th:href="@{/admin/users}"><i class="bi bi-arrow-left" aria-hidden="true"></i>Tous les utilisateurs</a>
    <div class="pagehead">
        <div>
            <h1 th:text="${user.id != null} ? |Modifier ${user.username}| : 'Nouvel utilisateur'">Nouvel utilisateur</h1>
        </div>
    </div>

    <form class="panel form-panel" th:action="${user.id != null ? '/admin/users/edit/' + user.id : '/admin/users/create'}"
          th:object="${user}" method="post">
        <fieldset>
            <legend>Compte</legend>
            <div class="fields">
                <div class="field">
                    <label for="username">Nom d'utilisateur</label>
                    <input class="input" type="text" th:field="*{username}" required autocomplete="off">
                </div>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input class="input" type="email" th:field="*{email}" required>
                </div>
                <div class="field">
                    <label for="firstName">Prénom</label>
                    <input class="input" type="text" th:field="*{firstName}">
                </div>
                <div class="field">
                    <label for="lastName">Nom</label>
                    <input class="input" type="text" th:field="*{lastName}">
                </div>
                <div class="field field--wide" th:if="${user.id == null}">
                    <label for="password">Mot de passe</label>
                    <input class="input" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
                    <span class="hint">8 caractères minimum. Transmettez-le à la personne de vive voix, pas par e-mail.</span>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Accès</legend>
            <div class="fields">
                <div class="field">
                    <label for="role">Rôle</label>
                    <select class="select" th:field="*{role}">
                        <option value="ADMIN">Administrateur</option>
                        <option value="MANAGER">Gestionnaire</option>
                        <option value="EMPLOYEE">Agent</option>
                    </select>
                    <span class="hint">Seuls les administrateurs voient cette page des utilisateurs.</span>
                </div>
                <div class="field" style="justify-content: center;">
                    <label class="check" for="enabled1">
                        <input type="checkbox" th:field="*{enabled}">
                        Compte actif, la personne peut se connecter
                    </label>
                </div>
            </div>
        </fieldset>

        <div class="form-actions">
            <a class="btn" th:href="@{/admin/users}">Annuler</a>
            <button type="submit" class="btn btn--primary" th:text="${user.id != null} ? 'Enregistrer les modifications' : 'Créer le compte'">Enregistrer</button>
        </div>
    </form>
</main>
</body>
</html>
