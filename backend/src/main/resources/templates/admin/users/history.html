<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique de connexion - Smart Waste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="bi bi-shield-lock"></i>
                Historique de connexion :
                <span th:text="${user.username}">user</span>
            </h2>
            <a th:href="@{/admin/users}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Retour
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${history.isEmpty()}" class="alert alert-info">
                    <i class="bi bi-info-circle"></i> Aucune connexion enregistrée pour cet utilisateur.
                </div>

                <table class="table table-hover" th:if="${!history.isEmpty()}">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Résultat</th>
                            <th>Adresse IP</th>
                            <th>Navigateur</th>
                            <th>Motif d'échec</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entry : ${history}" th:classappend="${!entry.success} ? 'table-danger'">
                            <td th:text="${#temporals.format(entry.loginTime, 'dd/MM/yyyy HH:mm:ss')}"></td>
                            <td>
                                <span th:if="${entry.success}" class="badge bg-success">Succès</span>
                                <span th:unless="${entry.success}" class="badge bg-danger">Échec</span>
                            </td>
                            <td th:text="${entry.ipAddress}"></td>
                            <td class="text-truncate" style="max-width: 320px;" th:text="${entry.userAgent}"></td>
                            <td th:text="${entry.failureReason}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
