<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(~{::title}, ~{})}">
    <title th:text="|Connexions de ${user.username} – SmartBin|">Connexions – SmartBin</title>
</head>
<body>
<header th:replace="~{layout/base :: topbar('users')}"></header>

<main class="page">
    <a class="crumb" th:href="@{/admin/users}"><i class="bi bi-arrow-left" aria-hidden="true"></i>Tous les utilisateurs</a>
    <div class="pagehead">
        <div>
            <h1 th:text="|Connexions de ${user.username}|">Connexions</h1>
            <p th:with="failed=${history.?[!success].size()}"
               th:text="${history.isEmpty()} ? 'Aucune tentative enregistrée.' : (${failed == 0} ? |${history.size()} tentative(s), toutes réussies.| : |${history.size()} tentative(s), dont ${failed} échouée(s). Plusieurs échecs rapprochés depuis la même adresse peuvent signaler une attaque par force brute.|)">
                0 tentatives.
            </p>
        </div>
    </div>

    <div class="panel panel--flush">
        <div class="table-wrap" th:if="${!history.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Date</th>
                    <th scope="col">Résultat</th>
                    <th scope="col">Adresse IP</th>
                    <th scope="col">Navigateur</th>
                    <th scope="col">Motif de l'échec</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${history}" th:classappend="${!e.success} ? 'is-failed'">
                    <td class="num" th:text="${#temporals.format(e.loginTime, 'dd/MM/yyyy HH:mm:ss')}">01/01/2026</td>
                    <td>
                        <span th:if="${e.success}" class="pill pill--ok">Réussie</span>
                        <span th:unless="${e.success}" class="pill pill--full">Échouée</span>
                    </td>
                    <td class="num" th:text="${e.ipAddress}">127.0.0.1</td>
                    <td style="max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                        th:text="${e.userAgent}" th:title="${e.userAgent}">navigateur</td>
                    <td><th:block th:if="${e.failureReason != null}"><th:block th:switch="${e.failureReason}">
                        <th:block th:case="'BadCredentialsException'">Mot de passe ou identifiant incorrect</th:block>
                        <th:block th:case="'DisabledException'">Compte désactivé</th:block>
                        <th:block th:case="'LockedException'">Compte verrouillé</th:block>
                        <th:block th:case="*" th:text="${e.failureReason}">autre</th:block>
                    </th:block></th:block></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${history.isEmpty()}">
            <div th:replace="~{fragments/header :: empty('Aucune connexion enregistrée.', 'Les tentatives de ce compte apparaîtront ici, réussies ou non.')}"></div>
        </th:block>
    </div>
</main>
</body>
</html>
