<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(~{::title}, ~{})}">
    <title>Conteneurs – SmartBin</title>
</head>
<body>
<header th:replace="~{layout/base :: topbar('containers')}"></header>

<main class="page">
    <div class="pagehead">
        <div>
            <h1>Conteneurs</h1>
            <p th:text="|${containers.size()} conteneurs affichés. Cliquez sur un nom pour voir son historique et sa position.|">10 conteneurs affichés.</p>
        </div>
        <div class="actions">
            <a th:href="@{/containers/create}" class="btn btn--primary"><i class="bi bi-plus-lg" aria-hidden="true"></i>Ajouter un conteneur</a>
        </div>
    </div>

    <form class="filters" method="get" th:action="@{/containers}" role="search">
        <label class="visually-hidden" for="search">Rechercher</label>
        <input class="input" type="search" id="search" name="search" th:value="${searchQuery}"
               placeholder="Nom, identifiant ou adresse">
        <label class="visually-hidden" for="region">Région</label>
        <select class="select" id="region" name="region">
            <option value="">Toutes les régions</option>
            <option th:each="r : ${regions}" th:value="${r}" th:text="${r}" th:selected="${selectedRegion == r}">Fès</option>
        </select>
        <label class="visually-hidden" for="status">Statut</label>
        <select class="select" id="status" name="status">
            <option value="">Tous les statuts</option>
            <option value="ACTIVE" th:selected="${selectedStatus == 'ACTIVE'}">Actif</option>
            <option value="FULL" th:selected="${selectedStatus == 'FULL'}">Plein</option>
            <option value="MAINTENANCE" th:selected="${selectedStatus == 'MAINTENANCE'}">En maintenance</option>
            <option value="INACTIVE" th:selected="${selectedStatus == 'INACTIVE'}">Inactif</option>
        </select>
        <button type="submit" class="btn">Filtrer</button>
        <a class="btn" th:href="@{/containers}"
           th:if="${(searchQuery != null and !searchQuery.isEmpty()) or (selectedRegion != null and !selectedRegion.isEmpty()) or (selectedStatus != null and !selectedStatus.isEmpty())}">Effacer les filtres</a>
    </form>

    <div class="panel panel--flush">
        <div class="table-wrap" th:if="${!containers.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Conteneur</th>
                    <th scope="col">Région</th>
                    <th scope="col">Remplissage et seuil</th>
                    <th scope="col">Statut</th>
                    <th scope="col"><span class="visually-hidden">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${containers}">
                    <td>
                        <a class="rowlink" th:href="@{/containers/{id}(id=${c.id})}" th:text="${c.name}">Nom</a>
                        <span class="sub" th:text="${c.containerId}">BIN-0001</span>
                    </td>
                    <td th:text="${c.region}">Fès</td>
                    <td><span th:replace="~{layout/base :: meter(${c})}"></span></td>
                    <td><th:block th:replace="~{layout/base :: status(${c.status})}"></th:block></td>
                    <td class="actions">
                        <a class="btn btn--sm" th:href="@{/containers/edit/{id}(id=${c.id})}">Modifier</a>
                        <form class="inline" th:action="@{/containers/delete/{id}(id=${c.id})}" method="post"
                              th:data-name="${c.name}" onsubmit="return confirm('Supprimer « ' + this.dataset.name + ' » et tout son historique ?')">
                            <button type="submit" class="btn btn--sm btn--icon btn--danger" th:aria-label="|Supprimer ${c.name}|">
                                <i class="bi bi-trash3" aria-hidden="true"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="empty" style="padding: 24px;" th:if="${containers.isEmpty()}">
            Aucun conteneur ne correspond à ces filtres. <a th:href="@{/containers}">Afficher tous les conteneurs</a>.
        </p>
    </div>
</main>
</body>
</html>
