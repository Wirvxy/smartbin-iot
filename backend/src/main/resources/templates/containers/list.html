<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteneurs - Smart Waste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 0.75rem 1rem;
            margin: 0.25rem 0;
            border-radius: 0.5rem;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255,255,255,0.1);
        }
        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .progress-bar-custom {
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 sidebar p-3">
                <div class="text-white mb-4">
                    <h4><i class="bi bi-trash3"></i> Smart Waste</h4>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/containers}">
                            <i class="bi bi-box-seam"></i> Conteneurs
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/users}">
                            <i class="bi bi-people"></i> Utilisateurs
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/reports}">
                            <i class="bi bi-file-earmark-text"></i> Rapports
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/alerts}">
                            <i class="bi bi-bell"></i> Alertes
                        </a>
                    </li>
                </ul>
                <div class="mt-auto pt-3">
                    <div class="text-white-50 small mb-2" sec:authentication="name"></div>
                    <a class="nav-link text-danger" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right"></i> Déconnexion
                    </a>
                </div>
            </nav>
            
            <main class="col-md-9 col-lg-10 ms-sm-auto main-content p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Gestion des Conteneurs</h2>
                    <a th:href="@{/containers/create}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Ajouter un conteneur
                    </a>
                </div>
                
                <!-- Filters -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form method="get" th:action="@{/containers}">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <input type="text" class="form-control" name="search" 
                                           th:value="${searchQuery}" placeholder="Rechercher...">
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" name="region">
                                        <option value="">Toutes les régions</option>
                                        <option th:each="r : ${regions}" th:value="${r}" 
                                                th:text="${r}" th:selected="${selectedRegion == r}"></option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" name="status">
                                        <option value="">Tous les statuts</option>
                                        <option value="ACTIVE" th:selected="${selectedStatus == 'ACTIVE'}">Actif</option>
                                        <option value="FULL" th:selected="${selectedStatus == 'FULL'}">Plein</option>
                                        <option value="MAINTENANCE" th:selected="${selectedStatus == 'MAINTENANCE'}">Maintenance</option>
                                        <option value="INACTIVE" th:selected="${selectedStatus == 'INACTIVE'}">Inactif</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <button type="submit" class="btn btn-primary w-100">Filtrer</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Containers Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nom</th>
                                        <th>Région</th>
                                        <th>Remplissage</th>
                                        <th>Statut</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="container : ${containers}">
                                        <td th:text="${container.containerId}"></td>
                                        <td th:text="${container.name}"></td>
                                        <td th:text="${container.region}"></td>
                                        <td>
                                            <div class="progress progress-bar-custom">
                                                <div class="progress-bar" 
                                                     th:classappend="${container.fillPercentage >= container.alertThreshold ? 'bg-danger' : (container.fillPercentage >= 60 ? 'bg-warning' : 'bg-success')}"
                                                     th:style="'width: ' + ${container.fillPercentage} + '%'"
                                                     th:text="${#numbers.formatDecimal(container.fillPercentage, 1, 1)} + '%'">
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <span class="badge" 
                                                  th:classappend="${container.status != null and container.status.name() == 'ACTIVE' ? 'bg-success' : (container.status != null and container.status.name() == 'FULL' ? 'bg-danger' : 'bg-secondary')}"
                                                  th:text="${container.status}">
                                            </span>
                                        </td>
                                        <td>
                                            <a th:href="@{/containers/{id}(id=${container.id})}" 
                                               class="btn btn-sm btn-info">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/containers/edit/{id}(id=${container.id})}" 
                                               class="btn btn-sm btn-warning">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/containers/delete/{id}(id=${container.id})}" 
                                                  method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-danger" 
                                                        onclick="return confirm('Êtes-vous sûr?')">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
