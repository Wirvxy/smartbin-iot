<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${container.name} + ' - Smart Waste'">Smart Waste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 300px; width: 100%; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 th:text="${container.name}">Conteneur</h2>
            <div>
                <a th:href="@{/containers/edit/{id}(id=${container.id})}" class="btn btn-warning">
                    <i class="bi bi-pencil"></i> Modifier
                </a>
                <form th:action="@{/containers/{id}/collect(id=${container.id})}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-arrow-clockwise"></i> Collecter
                    </button>
                </form>
            </div>
        </div>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Informations</h5>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <tr>
                                <th>ID Conteneur:</th>
                                <td th:text="${container.containerId}"></td>
                            </tr>
                            <tr>
                                <th>Nom:</th>
                                <td th:text="${container.name}"></td>
                            </tr>
                            <tr>
                                <th>Description:</th>
                                <td th:text="${container.description}"></td>
                            </tr>
                            <tr>
                                <th>Région:</th>
                                <td th:text="${container.region}"></td>
                            </tr>
                            <tr>
                                <th>Adresse:</th>
                                <td th:text="${container.address}"></td>
                            </tr>
                            <tr>
                                <th>Statut:</th>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${container.status != null and container.status.name() == 'ACTIVE' ? 'bg-success' : (container.status != null and container.status.name() == 'FULL' ? 'bg-danger' : 'bg-secondary')}"
                                          th:text="${container.status}">
                                    </span>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Niveau de Remplissage</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label>Remplissage actuel:</label>
                            <div class="progress" style="height: 30px;">
                                <div class="progress-bar" 
                                     th:classappend="${container.fillPercentage >= container.alertThreshold ? 'bg-danger' : (container.fillPercentage >= 60 ? 'bg-warning' : 'bg-success')}"
                                     th:style="'width: ' + ${container.fillPercentage} + '%'"
                                     th:text="${#numbers.formatDecimal(container.fillPercentage, 1, 1)} + '%'">
                                </div>
                            </div>
                        </div>
                        <table class="table">
                            <tr>
                                <th>Capacité:</th>
                                <td th:text="${#numbers.formatDecimal(container.capacity, 1, 1)} + ' L'"></td>
                            </tr>
                            <tr>
                                <th>Niveau actuel:</th>
                                <td th:text="${#numbers.formatDecimal(container.currentLevel, 1, 1)} + ' L'"></td>
                            </tr>
                            <tr>
                                <th>Seuil d'alerte:</th>
                                <td th:text="${#numbers.formatDecimal(container.alertThreshold, 1, 1)} + '%'"></td>
                            </tr>
                            <tr th:if="${container.lastCollection != null}">
                                <th>Dernière collecte:</th>
                                <td th:text="${#temporals.format(container.lastCollection, 'dd/MM/yyyy HH:mm')}"></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Localisation</h5>
                    </div>
                    <div class="card-body">
                        <div id="map"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Historique</h5>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Action</th>
                                    <th>Niveau</th>
                                    <th>Remplissage</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="entry : ${history}">
                                    <td th:text="${#temporals.format(entry.timestamp, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <span class="badge bg-info" th:text="${entry.action}"></span>
                                    </td>
                                    <td th:text="${#numbers.formatDecimal(entry.fillLevel, 1, 1)} + ' L'"></td>
                                    <td th:text="${#numbers.formatDecimal(entry.fillPercentage, 1, 1)} + '%'"></td>
                                    <td th:text="${entry.description}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:inline="javascript">
        const latitude = /*[[${container.latitude}]]*/ 36.8065;
        const longitude = /*[[${container.longitude}]]*/ 10.1815;
        const containerName = /*[[${container.name}]]*/ 'Container';
        const containerAddress = /*[[${container.address}]]*/ '';
        
        // Morocco-only bounds (approx., incl. Western Sahara)
        const moroccoBounds = L.latLngBounds([20.5, -17.6], [36.2, -0.9]);

        const map = L.map('map', {
            maxBounds: moroccoBounds,
            maxBoundsViscosity: 1.0,
            minZoom: 5,
            maxZoom: 18
        }).setView([latitude, longitude], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup('<b>' + containerName + '</b><br>' + containerAddress);
    </script>
</body>
</html>
