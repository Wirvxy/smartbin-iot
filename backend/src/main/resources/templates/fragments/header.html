<!-- Page fragments shared by several screens. -->
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Empty-state block: title plus one line telling the user what to do next. -->
<div th:fragment="empty(title, text)" style="padding: 28px 24px;">
    <p style="font: 600 22px/1.2 var(--font-display);" th:text="${title}">Rien ici.</p>
    <p class="empty" th:text="${text}">Explication.</p>
</div>

</body>
</html>
